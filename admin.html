<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfume Bliss - Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header">
    <div class="logo">Perfume Bliss</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="admin.html" class="active">Admin</a>
      <a href="cart.html">Cart</a>
      <span id="loginLink">
        <a href="login.html" id="loginBtn">Login</a>
      </span>
    </nav>
  </header>

  <section class="admin-section">
    <h2>Admin Panel</h2>
    <div id="adminMessage"></div>

    <form id="addProductForm">
      <h3>Add New Perfume</h3>
      <label for="productName">Product Name</label>
      <input type="text" id="productName" required />

      <label for="productPrice">Price</label>
      <input type="number" id="productPrice" required />

      <label for="productImage">Image URL</label>
      <input type="text" id="productImage" placeholder="images/productX.jpg" required />

      <button type="submit">Add Product</button>
    </form>

    <h3>Existing Products</h3>
    <div id="adminProductList">
      
    </div>
  </section>

  <footer class="main-footer">
    <p>&copy; 2025 Perfume Bliss. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
